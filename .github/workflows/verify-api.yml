name: Verify evidence API
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi python-multipart httpx uvicorn python-dotenv PyPDF2
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py src/decision.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/script.js
