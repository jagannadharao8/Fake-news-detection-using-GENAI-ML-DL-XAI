name: Verify deployed multi-provider vision
on:
  push:
    branches: [diagnostics/vision-availability-20261028]
    paths: [.github/workflows/diagnose-vision.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub requests pillow
      - run: |
          python - <<'PY'
          import os,json,time,io,hashlib
          from pathlib import Path
          import requests
          from PIL import Image,ImageDraw,ImageFont
          from huggingface_hub import HfApi,hf_hub_download
          api=HfApi(token=os.environ["HF_TOKEN"])
          if api.whoami().get("name")!="jagannadharao8":
              raise SystemExit("Unexpected credential owner.")
          space="jagannadharao8/fake-news-detection"
          expected="5bf7256a01c1ed734d5fc88e938bcf095cd3826a"
          source_matches=False
          stage=None
          for attempt in range(90):
              runtime=api.get_space_runtime(space)
              stage=getattr(runtime.stage,"value",runtime.stage)
              if stage=="RUNNING":
                  try:
                      data=Path(hf_hub_download(space,filename="src/vlm/infer.py",repo_type="space",token=os.environ["HF_TOKEN"])).read_bytes()
                      observed=hashlib.sha1(b"blob "+str(len(data)).encode()+bytes([0])+data).hexdigest()
                      source_matches=observed==expected
                  except Exception:
                      source_matches=False
                  if source_matches:
                      break
              time.sleep(5)
          secrets=api.get_space_secrets(space)
          variables=api.get_space_variables(space)
          print(json.dumps({"stage":stage,"sourceMatchesGithub":source_matches,
              "groqConfigured":"GROQ_API_KEY" in secrets or "GROQ_API_KEY" in variables,
              "geminiConfigured":"GEMINI_API_KEY" in secrets or "GEMINI_API_KEY" in variables}),flush=True)
          if stage!="RUNNING" or not source_matches:
              raise SystemExit("Matching runtime is not ready.")
          base="https://jagannadharao8-fake-news-detection.hf.space"
          health=requests.get(base+"/health",timeout=30)
          assert health.status_code==200
          html=requests.get(base+"/",timeout=30).text
          assert 'id="vision-card"' in html
          print(json.dumps({"health":health.status_code,"visionPanelPublished":True}),flush=True)
          image=Image.new("RGB",(480,300),"white")
          ImageDraw.Draw(image).text((20,110),"VERIFICATION CARD 7319",fill="black",font=ImageFont.load_default(size=24))
          image_bytes=io.BytesIO()
          image.save(image_bytes,format="PNG")
          results=[]
          for mode,text in [
              ("image_only",""),
              ("matching_text_image","The attached image is a white verification card that reads VERIFICATION CARD 7319."),
              ("mismatched_text_image","This photograph shows a crowded beach at sunset with many people swimming.")
          ]:
              try:
                  response=requests.post(base+"/api/analyze",files={"image":("verification.png",image_bytes.getvalue(),"image/png")},
                      data={"text":text},timeout=150)
                  row={"input":mode,"status":response.status_code}
                  if response.status_code==200:
                      value=response.json()
                      vision=value.get("vision",{})
                      row.update(available=vision.get("available"),visionLabel=vision.get("label"),
                          provider=vision.get("provider"),model=vision.get("model"),
                          verdict=value.get("verdict"),cardMatches=value.get("verdict")==value.get("card",{}).get("final_label"))
                  print(json.dumps(row),flush=True)
                  results.append(row)
              except requests.RequestException as error:
                  row={"input":mode,"requestErrorType":type(error).__name__}
                  print(json.dumps(row),flush=True)
                  results.append(row)
          if not all(row.get("status")==200 and row.get("available") is True and row.get("cardMatches") is True for row in results):
              raise SystemExit("One or more live image assessments did not complete.")
          print("All deployed image-only and text/image paths completed with an available vision provider.",flush=True)
          PY
